name: Verify library

on:
  push:
  pull_request:

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      count: ${{ steps.affected.outputs.count }}
      matrix: ${{ steps.affected.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select affected verify targets
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/library_manager.py affected --base "$BASE_SHA" --format github >> "$GITHUB_OUTPUT"

      - name: Check library dependencies and expansion
        run: python3 tools/library_manager.py all

      - name: No affected verify targets
        if: steps.affected.outputs.count == '0'
        run: echo "No verify targets are affected by this change."

  verify:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-verify.txt

      - name: Install verification helper
        run: python3 -m pip install -r requirements-verify.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/online-judge-tools/library-checker-problems
          key: library-checker-problems-${{ hashFiles('requirements-verify.txt') }}

      - uses: actions/cache@v4
        with:
          path: .verify-helper/cache
          key: oj-verify-${{ hashFiles('requirements-verify.txt') }}-${{ matrix.target }}

      - name: Expand ${{ matrix.target }}
        run: python3 tools/library_manager.py expand-verify "${{ matrix.target }}"

      - name: Verify ${{ matrix.target }}
        run: python3 tools/verify.py --expanded "${{ matrix.target }}"
